name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wearos:
    name: Wear OS (unit tests + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wearos-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WearBridge-wearos-debug-apk
          path: wearos-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wearos-test-reports
          path: wearos-app/app/build/reports/tests/

  ios:
    name: iOS companion (unit tests + unsigned device build)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v7

      # The app targets iOS 26, so it needs the newest Xcode on the runner, not the default.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Unit tests (simulator)
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in sorted(d.items(), reverse=True) if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          xcodebuild test -project AncsBridge.xcodeproj -scheme AncsBridge \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO

      - name: Unsigned device build
        run: |
          set -euo pipefail
          xcodebuild build -project AncsBridge.xcodeproj -scheme AncsBridge -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=

      # Unsigned: sideload tools (AltStore, SideStore, Sideloadly) re-sign it with your Apple ID.
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd-device/Build/Products/Release-iphoneos/AncsBridge.app"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" "$GITHUB_WORKSPACE/artifacts"
          ditto "$APP" "$RUNNER_TEMP/pkg/Payload/AncsBridge.app"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/artifacts/WearBridge-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: WearBridge-ios-unsigned-ipa
          path: artifacts/WearBridge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
